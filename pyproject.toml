[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot"
version = "0.1.0"
description = "AI-powered job hunting assistant for Chinese recruitment platforms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "janedoe" },
]
keywords = ["job", "recruitment", "ai", "boss", "resume"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown>=3.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
linkedin = ["python-jobspy>=1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
